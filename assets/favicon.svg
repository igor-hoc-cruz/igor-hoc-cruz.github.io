  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#g)"/>
  <circle cx="32" cy="32" r="27" fill="url(#m)"/>
  <text x="32" y="40.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="url(#g)">IC</text>
